<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>chordlist mark — 3D print model</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="22" fill="#0a0a0a"></rect>
  <rect x="36" y="30" width="9" height="27" rx="4.5" fill="#fafafa"></rect>
  <rect x="55" y="30" width="9" height="27" rx="4.5" fill="#fafafa"></rect>
  <rect x="39.5" y="57" width="2" height="13" fill="#fafafa"></rect>
  <rect x="58.5" y="57" width="2" height="13" fill="#fafafa"></rect>
</svg>
</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Keep the downloaded bundle useful as a plain, unnumbered community model.
    // Optional serial tooling is opt-in at /model.html?numbering=1; the other
    // flags provide a ready-to-assemble starting point and the clean product-page
    // render without maintaining a second copy of the geometry.
    const publicParams = new URLSearchParams(window.location.search);
    const modelOptions = Object.freeze({
      numbering: publicParams.get('numbering') === '1',
      nfc: publicParams.get('nfc') === '1',
      preview: publicParams.get('preview') === '1'
    });
    function replaceModelSource(source, before, after) {
      if (!source.includes(before)) throw new Error('Model bundle customization is out of date');
      return source.replace(before, after);
    }
    const modelReplacements = [
      [
        'const { THREE } = await stage.ready;',
        "const { THREE } = await stage.ready;\nif (window.CHORDLINK_PREVIEW_ONLY === true && stage.shadowRoot) {\n  for (const selector of ['.toolbar', '.note']) {\n    const element = stage.shadowRoot.querySelector(selector);\n    if (element) element.style.display = 'none';\n  }\n}"
      ],
      [
        '                 num, numH, markH, depth, inlay, inlayGap, numberTop }) {',
        '                 num, numH, markH, depth, inlay, inlayGap, numberTop, numbering }) {'
      ],
      [
        '  const number = engrave\n    ? textContours(num, numH, 0, numberTop ? numRow : -numRow, inner)',
        '  const number = engrave && numbering\n    ? textContours(num, numH, 0, numberTop ? numRow : -numRow, inner)'
      ],
      [
        "    ? textContours('chordlist', markH, 0, numberTop ? -numH * 0.5 : numH * 0.5, inner)",
        "    ? textContours('chordlist', markH, 0, numbering ? (numberTop ? -numH * 0.5 : numH * 0.5) : 0, inner)"
      ],
      [
        "  const textParts = engrave\n    ? [{ name: 'number', ...number }, { name: 'wordmark', ...wordmark }]\n    : [];",
        "  const textParts = engrave\n    ? [...(numbering ? [{ name: 'number', ...number }] : []), { name: 'wordmark', ...wordmark }]\n    : [];"
      ],
      [
        '    inlayGap: Number(ui.inlayGap.value)\n  };',
        '    inlayGap: Number(ui.inlayGap.value),\n    numbering: window.CHORDLINK_NUMBERING_ENABLED === true\n  };'
      ],
      [
        "ui.numberTop.addEventListener('change', () => apply(false));\napply(true);",
        "ui.numberTop.addEventListener('change', () => apply(false));\nif (window.CHORDLINK_NFC_ENABLED === true) ui.nfc.checked = true;\napply(true);\nif (window.CHORDLINK_PREVIEW_ONLY === true && stage._camera && stage._controls) {\n  stage._camera.position.multiplyScalar(0.72);\n  stage._controls.update();\n}"
      ],
      [
        'const cfgKeys = Object.keys(ui);',
        "const cfgKeys = Object.keys(ui).filter(k => window.CHORDLINK_NUMBERING_ENABLED || !['num', 'digits', 'numH', 'numberTop'].includes(k));"
      ],
      [
        "};\n\ndocument.getElementById('stl').addEventListener('click', () => {",
        "};\n\nconst exportName = (suffix = '') => {\n  const serial = window.CHORDLINK_NUMBERING_ENABLED\n    ? '-' + pad(Math.round(Number(ui.num.value) || 0))\n    : '';\n  return 'chordlink' + serial + suffix;\n};\n\ndocument.getElementById('stl').addEventListener('click', () => {"
      ],
      [
        '    `chordlist-tile-${pad(Math.round(Number(ui.num.value) || 0))}.stl`);',
        "    exportName() + '.stl');"
      ],
      [
        "    { name: `chordlist-tile-${n}-plate.stl`, data: new Uint8Array(stlBuffer(o => !isAccent(o))) },\n    { name: `chordlist-tile-${n}-accent.stl`, data: new Uint8Array(stlBuffer(isAccent)) }\n  ]), `chordlist-tile-${n}-2colour.zip`);",
        "    { name: exportName('-plate') + '.stl', data: new Uint8Array(stlBuffer(o => !isAccent(o))) },\n    { name: exportName('-accent') + '.stl', data: new Uint8Array(stlBuffer(isAccent)) }\n  ]), exportName('-2colour') + '.zip');"
      ]
    ];
    for (const [before, after] of modelReplacements) {
      template = replaceModelSource(template, before, after);
    }

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';window.CHORDLINK_NUMBERING_ENABLED=' + JSON.stringify(modelOptions.numbering) +
      ';window.CHORDLINK_NFC_ENABLED=' + JSON.stringify(modelOptions.nfc) +
      ';window.CHORDLINK_PREVIEW_ONLY=' + JSON.stringify(modelOptions.preview) +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    const numberGroup = doc.getElementById('num')?.closest('.num');
    const numberDivider = numberGroup?.previousElementSibling?.classList.contains('hr')
      ? numberGroup.previousElementSibling
      : null;
    const numberingOptions = [
      numberDivider,
      numberGroup,
      doc.getElementById('numtop')?.closest('label'),
      doc.getElementById('numh')?.closest('label'),
      doc.getElementById('nfrom')?.closest('.num')
    ];
    for (const element of numberingOptions) {
      element?.toggleAttribute('hidden', !modelOptions.numbering);
    }
    if (modelOptions.preview) doc.querySelector('.caption')?.setAttribute('hidden', '');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>chordlist mark — 3D print model<\u002Ftitle>\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.184.0/build/three.module.js\",\n    \"three/addons/controls/OrbitControls.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\",\n    \"three/addons/exporters/OBJExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\",\n    \"three/addons/exporters/GLTFExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\"\n  },\n  \"integrity\": {\n    \"https://unpkg.com/three@0.184.0/build/three.module.js\": \"sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J\",\n    \"https://unpkg.com/three@0.184.0/build/three.core.js\": \"sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\": \"sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\": \"sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\": \"sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ\"\n  }\n}\n<\u002Fscript>\n<style>/* Neutral scale — copied verbatim from chordlist-website app/globals.css (oklch, zero chroma) */\n:root{\n  --gray-0: oklch(1 0 0);\n  --gray-50: oklch(0.985 0 0);\n  --gray-100: oklch(0.97 0 0);\n  --gray-200: oklch(0.922 0 0);\n  --gray-300: oklch(0.87 0 0);\n  --gray-400: oklch(0.708 0 0);\n  --gray-500: oklch(0.556 0 0);\n  --gray-600: oklch(0.439 0 0);\n  --gray-700: oklch(0.371 0 0);\n  --gray-800: oklch(0.269 0 0);\n  --gray-900: oklch(0.205 0 0);\n  --gray-950: oklch(0.145 0 0);\n\n  /* Brand accent — iOS system blue used for interactive elements in the app (edit, play, links).\n     The marketing site itself stays fully grayscale; blue is the app's tap-target color only. */\n  --color-brand-blue: oklch(0.62 0.19 259);\n  --color-brand-blue-hover: oklch(0.56 0.19 259);\n  --color-brand-blue-tint: oklch(0.94 0.03 259);\n\n  /* Semantic aliases — light mode (default) */\n  --background: var(--gray-0);\n  --foreground: var(--gray-950);\n  --surface: var(--gray-0);\n  --surface-muted: var(--gray-50);\n  --card: var(--gray-0);\n  --card-foreground: var(--gray-950);\n  --muted: var(--gray-100);\n  --muted-foreground: var(--gray-500);\n  --border: var(--gray-200);\n  --input: var(--gray-200);\n  --ring: var(--gray-400);\n  --primary: var(--gray-900);\n  --primary-foreground: var(--gray-50);\n  --secondary: var(--gray-100);\n  --secondary-foreground: var(--gray-900);\n  --accent: var(--gray-100);\n  --accent-foreground: var(--gray-900);\n  --destructive: oklch(0.577 0.245 27.325);\n  --interactive: var(--color-brand-blue);\n  --interactive-hover: var(--color-brand-blue-hover);\n  --interactive-tint: var(--color-brand-blue-tint);\n}\n\n.dark{\n  --background: var(--gray-950);\n  --foreground: var(--gray-50);\n  --surface: var(--gray-900);\n  --surface-muted: var(--gray-800);\n  --card: var(--gray-900);\n  --card-foreground: var(--gray-50);\n  --muted: var(--gray-800);\n  --muted-foreground: var(--gray-400);\n  --border: oklch(1 0 0 / 10%);\n  --input: oklch(1 0 0 / 15%);\n  --ring: var(--gray-500);\n  --primary: var(--gray-200);\n  --primary-foreground: var(--gray-900);\n  --secondary: var(--gray-800);\n  --secondary-foreground: var(--gray-50);\n  --accent: var(--gray-800);\n  --accent-foreground: var(--gray-50);\n  --destructive: oklch(0.704 0.191 22.216);\n  --interactive: oklch(0.7 0.17 259);\n  --interactive-hover: oklch(0.76 0.15 259);\n  --interactive-tint: oklch(0.3 0.06 259);\n}\n<\u002Fstyle>\n<script src=\"e99339ac-4d7f-4128-b302-bc42217769f2\"><\u002Fscript>\n<style>/* Geist — chordlist's real brand typeface (used eight:100vh}\n  .caption{position:fixed;left:24px;top:22px;bottom:52px;width:200px;z-index:5;overflow-y:auto;padding-right:10px;padding-bottom:8px}\n  .caption h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--foreground)}\n  .caption p{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--muted-foreground);font-family:\"Geist Mono\",ui-monospace,monospace}\n  .tweak{display:block;margin-top:20px;width:100%}\n  .tweak span{display:flex;justify-content:space-between;font-size:12px;color:var(--muted-foreground);font-family:\"Geist Mono\",ui-monospace,monospace}\n  .tweak b{font-weight:500;color:var(--foreground)}\n  .tweak input{-webkit-appearance:none;appearance:none;width:100%;height:2px;margin-top:10px;border-radius:1px;background:var(--gray-300);outline:none;accent-color:#171717}\n  .tweak input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:999px;background:var(--gray-900);cursor:pointer}\n  .tweak input::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:999px;background:var(--gray-900);cursor:pointer}\n  #stl{margin-top:18px;margin-bottom:4px;padding:9px 16px;border:0;border-radius:999px;background:var(--primary);color:var(--primary-foreground);font:500 13px Geist,ui-sans-serif,system-ui,sans-serif;cursor:pointer}\n  #stl:hover{background:var(--gray-800)}\n  #stl:active{transform:translateY(1px)}\n  .tweak.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}\n  .cfg{margin-top:22px;display:flex;flex-direction:column;gap:8px}\n  #cfg{width:100%;box-sizing:border-box;resize:vertical;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--foreground);font:11px/1.5 \"Geist Mono\",ui-monospace,monospace}\n  #cfg:focus{outline:none;border-color:var(--gray-400)}\n  .cfg-row{display:flex;gap:8px}\n  .cfg-row button{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--foreground);font:500 12px Geist,ui-sans-serif,system-ui,sans-serif;cursor:pointer}\n  .cfg-row button:hover{background:var(--gray-100)}\n  .cfg-row button:active{transform:translateY(1px)}\n  #cfg-note{min-height:14px;font:11px \"Geist Mono\",ui-monospace,monospace;color:var(--muted-foreground)}\n  .tweak.toggle span{flex:1}\n  [hidden]{display:none!important}\n  .hr{margin-top:22px;border-top:1px solid var(--border)}\n  .num{margin-top:16px;display:flex;flex-direction:column;gap:8px}\n  .num label{display:flex;align-items:center;justify-content:space-between;gap:8px;font:12px \"Geist Mono\",ui-monospace,monospace;color:var(--muted-foreground)}\n  .num input{width:74px;box-sizing:border-box;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--foreground);font:12px \"Geist Mono\",ui-monospace,monospace}\n  .num input:focus{outline:none;border-color:var(--gray-400)}\n  #batch{margin-top:6px;padding:8px 14px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--foreground);font:500 12px Geist,ui-sans-serif,system-ui,sans-serif;cursor:pointer}\n  #batch:hover{background:var(--gray-100)}\n  #batch:active{transform:translateY(1px)}\n  #batch-note{font:11px \"Geist Mono\",ui-monospace,monospace;color:var(--muted-foreground);min-height:14px}\n  .tweak.toggle input{width:16px;height:16px;margin:0;accent-color:#171717;cursor:pointer}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"caption\">\n  <h1>chordlist mark — printable<\u002Fh1>\n  <p id=\"dims\">32.0 mm squircle · 1.2 mm plate<br>1.6 mm total height<\u002Fp>\n  <label class=\"tweak\" for=\"size\">\n    <span>tile size<b id=\"size-val\">32.0 mm<\u002Fb><\u002Fspan>\n    <input id=\"size\" type=\"range\" min=\"28\" max=\"60\" step=\"0.1\" value=\"32\">\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"plate\">\n    <span>plate thickness<b id=\"plate-val\">1.2 mm<\u002Fb><\u002Fspan>\n    <input id=\"plate\" type=\"range\" min=\"1\" max=\"4\" step=\"0.1\" value=\"1.2\">\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"pad\">\n    <span>padding<b id=\"pad-val\">1.0 mm<\u002Fb><\u002Fspan>\n    <input id=\"pad\" type=\"range\" min=\"0\" max=\"6\" step=\"0.1\" value=\"0\">\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"stem\">\n    <span>hairline width<b id=\"stem-val\">2.9 mm<\u002Fb><\u002Fspan>\n    <input id=\"stem\" type=\"range\" min=\"0.5\" max=\"4\" step=\"0.1\" value=\"1.5\">\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"relief\">\n    <span>key height<b id=\"relief-val\">0.4 mm<\u002Fb><\u002Fspan>\n    <input id=\"relief\" type=\"range\" min=\"0.1\" max=\"1.5\" step=\"0.1\" value=\"0.4\">\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"edge\">\n    <span>edge radius<b id=\"edge-val\">0.3 mm<\u002Fb><\u002Fspan>\n    <input id=\"edge\" type=\"range\" min=\"0\" max=\"0.8\" step=\"0.05\" value=\"0.3\">\n  <\u002Flabel>\n  <label class=\"tweak toggle\" for=\"nfc\">\n    <span>NFC cavity<b id=\"nfc-val\">off<\u002Fb><\u002Fspan>\n    <input id=\"nfc\" type=\"checkbox\">\n  <\u002Flabel>\n  <label class=\"tweak toggle\" for=\"open\">\n    <span>open at bottom<b id=\"open-val\">off<\u002Fb><\u002Fspan>\n    <input id=\"open\" type=\"checkbox\">\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"tagh\">\n    <span>tag thickness<b id=\"tagh-val\">0.4 mm<\u002Fb><\u002Fspan>\n    <input id=\"tagh\" type=\"range\" min=\"0.2\" max=\"1.5\" step=\"0.1\" value=\"0.4\">\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"tag\">\n    <span>tag diameter<b id=\"tag-val\">27.0 mm<\u002Fb><\u002Fspan>\n    <input id=\"tag\" type=\"range\" min=\"14\" max=\"32\" step=\"0.1\" value=\"27\">\n  <\u002Flabel>\n  <div class=\"hr\"><\u002Fdiv>\n  <div class=\"num\">\n    <label for=\"num\">number<input id=\"num\" type=\"number\" min=\"0\" max=\"9999\" step=\"1\" value=\"1\"><\u002Flabel>\n    <label for=\"digits\">digits<input id=\"digits\" type=\"number\" min=\"1\" max=\"4\" step=\"1\" value=\"3\"><\u002Flabel>\n  <\u002Fdiv>\n  <label class=\"tweak toggle\" for=\"numtop\">\n    <span>number at top<b id=\"numtop-val\">off<\u002Fb><\u002Fspan>\n    <input id=\"numtop\" type=\"checkbox\">\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"markh\">\n    <span>wordmark height<b id=\"markh-val\">6.00 mm<\u002Fb><\u002Fspan>\n    <input id=\"markh\" type=\"range\" min=\"3\" max=\"14\" step=\"0.25\" value=\"6\">\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"numh\">\n    <span>number height<b id=\"numh-val\">4.0 mm<\u002Fb><\u002Fspan>\n    <input id=\"numh\" type=\"range\" min=\"2\" max=\"12\" step=\"0.25\" value=\"4\">\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"depth\">\n    <span>text depth<b id=\"depth-val\">0.60 mm<\u002Fb><\u002Fspan>\n    <input id=\"depth\" type=\"range\" min=\"0.01\" max=\"1.2\" step=\"0.01\" value=\"0.6\">\n  <\u002Flabel>\n  <label class=\"tweak toggle\" for=\"inlay\">\n    <span>text inlay<b id=\"inlay-val\">on<\u002Fb><\u002Fspan>\n    <input id=\"inlay\" type=\"checkbox\" checked>\n  <\u002Flabel>\n  <label class=\"tweak\" for=\"gap\">\n    <span>inlay gap<b id=\"gap-val\">0.06 mm<\u002Fb><\u002Fspan>\n    <input id=\"gap\" type=\"range\" min=\"0\" max=\"0.2\" step=\"0.01\" value=\"0.06\">\n  <\u002Flabel>\n  <button id=\"stl\" type=\"button\">Download STL (mm)<\u002Fbutton>\n  <button id=\"stl-parts\" type=\"button\">Download 2-colour parts (ZIP)<\u002Fbutton>\n  <div class=\"num\">\n    <label for=\"nfrom\">range from<input id=\"nfrom\" type=\"number\" min=\"0\" max=\"9999\" step=\"1\" value=\"1\"><\u002Flabel>\n    <label for=\"nto\">range to<input id=\"nto\" type=\"number\" min=\"0\" max=\"9999\" step=\"1\" value=\"8\"><\u002Flabel>\n    <button id=\"batch\" type=\"button\">Export range as ZIP<\u002Fbutton>\n    <span id=\"batch-note\"><\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"cfg\">\n    <textarea id=\"cfg\" rows=\"3\" spellcheck=\"false\"><\u002Ftextarea>\n    <div class=\"cfg-row\">\n      <button id=\"cfg-copy\" type=\"button\">Copy config<\u002Fbutton>\n      <button id=\"cfg-load\" type=\"button\">Apply<\u002Fbutton>\n    <\u002Fdiv>\n    <span id=\"cfg-note\"><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<three-d-stage name=\"chordlist-icon-tile\" background=\"#f4f4f5\"><\u002Fthree-d-stage>\n<script src=\"1159b26f-f21d-4e8f-b531-076459c552be\"><\u002Fscript>\n<script type=\"module\">\nconst stage = document.querySelector('three-d-stage');\nconst { THREE } = await stage.ready;\n\n// Real Geist outlines for the engraved bottom face, read straight from the\n// shipped TTF (opentype.js gives glyph paths; three's typeface JSON isn't\n// needed). SemiBold keeps the strokes wide enough for an FDM nozzle. The face\n// ships base64 in a sibling script so the standalone bundle stays offline-safe.\nconst opentype = await import('https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.module.js');\nconst ttf = window.GEIST_TTF_B64\n  ? Uint8Array.from(atob(window.GEIST_TTF_B64), c => c.charCodeAt(0)).buffer\n  : await (await fetch('assets/Geist-SemiBold.ttf')).arrayBuffer();\nconst geist = opentype.parse(ttf);\n\n// Flatten a glyph run into y-up polygons, split into outer contours and the\n// counters inside them (odd containment depth = counter).\nfunction glyphContours(text, size) {\n  const cmds = geist.getPath(String(text), 0, 0, size).commands;\n  const subs = [];\n  let cur = null, px = 0, py = 0;\n  const quad = (x1, y1, x, y) => {\n    for (let i = 1; i <= 6; i++) {\n      const t = i / 6, u = 1 - t;\n      cur.push([u * u * px + 2 * u * t * x1 + t * t * x, u * u * py + 2 * u * t * y1 + t * t * y]);\n    }\n  };\n  const cubic = (x1, y1, x2, y2, x, y) => {\n    for (let i = 1; i <= 8; i++) {\n      const t = i / 8, u = 1 - t;\n      cur.push([\n        u * u * u * px + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x,\n        u * u * u * py + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * y]);\n    }\n  };\n  const close = () => { if (cur && cur.length > 2) subs.push(cur); cur = null; };\n  for (const c of cmds) {\n    if (c.type === 'M') { close(); cur = [[c.x, c.y]]; }\n    else if (c.type === 'L') cur.push([c.x, c.y]);\n    else if (c.type === 'Q') quad(c.x1, c.y1, c.x, c.y);\n    else if (c.type === 'C') cubic(c.x1, c.y1, c.x2, c.y2, c.x, c.y);\n    else if (c.type === 'Z') { close(); continue; }\n    if (c.type !== 'Z') { px = c.x; py = c.y; }\n  }\n  close();\n  // path space is y-down; the plate works in y-up\n  const polys = subs.map(p => p.map(([x, y]) => [x, -y]));\n  const inside = (pt, poly) => {\n    let hit = false;\n    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {\n      const [xi, yi] = poly[i], [xj, yj] = poly[j];\n      if ((yi > pt[1]) !== (yj > pt[1]) &&\n          pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) hit = !hit;\n    }\n    return hit;\n  };\n  const outers = [], islands = [];\n  polys.forEach((p, i) => {\n    let depth = 0;\n    polys.forEach((q, j) => { if (i !== j && inside(p[0], q)) depth++; });\n    (depth % 2 ? islands : outers).push(p);\n  });\n  return { outers, islands };\n}\n\n// Returns contours in plate-shape space, mirrored in x so the text reads\n// correctly when the tile is turned over.\nfunction textContours(text, targetH, cx, cy, maxW) {\n  const { outers: o0, islands: i0 } = glyphContours(text, 100);\n  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;\n  for (const p of o0) for (const [x, y] of p) {\n    minX = Math.min(minX, x); maxX = Math.max(maxX, x);\n    minY = Math.min(minY, y); maxY = Math.max(maxY, y);\n  }\n  if (!Number.isFinite(minX)) {\n    return { outers: [], islands: [], width: 0, height: 0, limited: false };\n  }\n  let k = targetH / (maxY - minY);\n  let limited = false;\n  if (maxW && (maxX - minX) * k > maxW) { k = maxW / (maxX - minX); limited = true; }\n  const bx = (minX + maxX) / 2, by = (minY + maxY) / 2;\n  const map = pts => pts.map(([x, y]) => [cx - (x - bx) * k, cy + (y - by) * k]);\n  return {\n    outers: o0.map(map), islands: i0.map(map),\n    // the height asked for, unless the tile was too narrow to grant it\n    width: (maxX - minX) * k, height: (maxY - minY) * k, limited\n  };\n}\n\n// The smallest isolated piece of lettering — on the wordmark, the dot over the\n// i. Clearance is taken out of these, so this is the figure the gap slider eats\n// into, and the accent shape that disappears first if it is set too wide.\nfunction minFeature(contours) {\n  let m = Infinity;\n  for (const c of contours) {\n    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;\n    for (const [x, y] of c) {\n      x0 = Math.min(x0, x); x1 = Math.max(x1, x);\n      y0 = Math.min(y0, y); y1 = Math.max(y1, y);\n    }\n    m = Math.min(m, x1 - x0, y1 - y0);\n  }\n  return m;\n}\n\n// The narrowest strip of plate left standing between two recesses — between the\n// dot and the stem of the i, or between two letters. This, not the size of the\n// lettering, is what decides whether the bottom face prints: below one extrusion\n// width the bridge never lays down and the two accent shapes run together, which\n// is how a dotted i comes out reading as an l.\nfunction narrowestBridge(contours) {\n  const box = (c) => {\n    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;\n    for (const [x, y] of c) {\n      x0 = Math.min(x0, x); x1 = Math.max(x1, x);\n      y0 = Math.min(y0, y); y1 = Math.max(y1, y);\n    }\n    return [x0, x1, y0, y1];\n  };\n  const boxes = contours.map(box);\n  const toSeg = (pt, a, b) => {\n    const dx = b[0] - a[0], dy = b[1] - a[1];\n    const l2 = dx * dx + dy * dy || 1e-12;\n    let t = ((pt[0] - a[0]) * dx + (pt[1] - a[1]) * dy) / l2;\n    t = Math.max(0, Math.min(1, t));\n    return Math.hypot(pt[0] - (a[0] + t * dx), pt[1] - (a[1] + t * dy));\n  };\n  let best = Infinity;\n  for (let i = 0; i < contours.length; i++) {\n    for (let j = i + 1; j < contours.length; j++) {\n      const A = boxes[i], B = boxes[j];\n      // bounding boxes already further apart than the best pair can't beat it\n      const dx = Math.max(0, A[0] - B[1], B[0] - A[1]);\n      const dy = Math.max(0, A[2] - B[3], B[2] - A[3]);\n      if (Math.hypot(dx, dy) >= best) continue;\n      for (const pt of contours[i]) {\n        const q = contours[j];\n        for (let k = 0, l = q.length - 1; k < q.length; l = k++) {\n          const d = toSeg(pt, q[l], q[k]);\n          if (d < best) best = d;\n        }\n      }\n    }\n  }\n  return Number.isFinite(best) ? best : Infinity;\n}\n\nconst MM = 0.001;\nconst mm = v => v * MM;\n\nfunction roundedRect(w, h, r) {\n  const s = new THREE.Shape();\n  const x = -w / 2, y = -h / 2;\n  s.moveTo(x + r, y);\n  s.lineTo(x + w - r, y);\n  s.quadraticCurveTo(x + w, y, x + w, y + r);\n  s.lineTo(x + w, y + h - r);\n  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);\n  s.lineTo(x + r, y + h);\n  s.quadraticCurveTo(x, y + h, x, y + h - r);\n  s.lineTo(x, y + r);\n  s.quadraticCurveTo(x, y, x + r, y);\n  return s;\n}\n\n// iOS-style squircle: superellipse |x/a|^n + |y/a|^n = 1\nfunction squircle(size, n = 4.6, steps = 180) {\n  const a = size / 2;\n  const s = new THREE.Shape();\n  for (let i = 0; i <= steps; i++) {\n    const t = (i / steps) * Math.PI * 2;\n    const c = Math.cos(t), si = Math.sin(t);\n    const x = a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);\n    const y = a * Math.sign(si) * Math.pow(Math.abs(si), 2 / n);\n    i ? s.lineTo(x, y) : s.moveTo(x, y);\n  }\n  s.closePath();\n  return s;\n}\n\nfunction extrude(shape, depth, bevel) {\n  if (!(bevel > 0)) {\n    const g0 = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 24 });\n    g0.center();\n    return g0;\n  }\n  const g = new THREE.ExtrudeGeometry(shape, {\n    depth: depth - bevel * 2,\n    bevelEnabled: true,\n    bevelThickness: bevel,\n    bevelSize: bevel,\n    bevelOffset: -bevel,\n    bevelSegments: 3,\n    curveSegments: 24\n  });\n  g.center();\n  return g;\n}\n\nconst graphite = new THREE.MeshStandardMaterial({\n  name: 'graphite', color: '#1c1c1e', roughness: 0.5, metalness: 0.1\n});\nconst bone = new THREE.MeshStandardMaterial({\n  name: 'bone', color: '#f7f7f8', roughness: 0.75, metalness: 0.05\n});\n\nconst model = new THREE.Group();\nmodel.name = 'chordlist_icon_tile';\n\n// --- polygon helpers: parts are clipped against the plate outline, so at\n// zero padding the mark's rounded ends are genuinely cut off at the edge ---\nfunction rectPoints(cx, cy, w, h, r, seg = 6) {\n  const p = [];\n  const c = [[cx + w / 2 - r, cy + h / 2 - r, 0], [cx - w / 2 + r, cy + h / 2 - r, Math.PI / 2],\n             [cx - w / 2 + r, cy - h / 2 + r, Math.PI], [cx + w / 2 - r, cy - h / 2 + r, -Math.PI / 2]];\n  for (const [ax, ay, a0] of c) {\n    for (let i = 0; i <= seg; i++) {\n      const a = a0 + (i / seg) * (Math.PI / 2);\n      p.push([ax + r * Math.cos(a), ay + r * Math.sin(a)]);\n    }\n  }\n  return p;\n}\n\n// iOS-style squircle: superellipse |x/a|^n + |y/a|^n = 1\nfunction squirclePoints(size, n = 4.6, steps = 160) {\n  const a = size / 2, p = [];\n  for (let i = 0; i < steps; i++) {\n    const t = (i / steps) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);\n    p.push([a * Math.sign(c) * Math.pow(Math.abs(c), 2 / n),\n            a * Math.sign(s) * Math.pow(Math.abs(s), 2 / n)]);\n  }\n  return p;\n}\n\n// Sutherland–Hodgman; valid because the squircle clip polygon is convex.\nfunction clipToConvex(subject, clip) {\n  let out = subject;\n  for (let i = 0; i < clip.length && out.length; i++) {\n    const a = clip[i], b = clip[(i + 1) % clip.length];\n    const side = (p) => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);\n    const inp = out; out = [];\n    for (let j = 0; j < inp.length; j++) {\n      const cur = inp[j], prev = inp[(j + inp.length - 1) % inp.length];\n      const dc = side(cur), dp = side(prev);\n      if (dc >= 0) {\n        if (dp < 0) {\n          const t = dp / (dp - dc);\n          out.push([prev[0] + t * (cur[0] - prev[0]), prev[1] + t * (cur[1] - prev[1])]);\n        }\n        out.push(cur);\n      } else if (dp >= 0) {\n        const t = dp / (dp - dc);\n        out.push([prev[0] + t * (cur[0] - prev[0]), prev[1] + t * (cur[1] - prev[1])]);\n      }\n    }\n  }\n  return out;\n}\n\nfunction shapeFrom(points) {\n  const s = new THREE.Shape();\n  points.forEach(([x, y], i) => (i ? s.lineTo(x, y) : s.moveTo(x, y)));\n  s.closePath();\n  return s;\n}\n\nfunction shapeWithHoles(outer, holes) {\n  const s = shapeFrom(outer);\n  for (const h of holes) {\n    const p = new THREE.Path();\n    h.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));\n    p.closePath();\n    s.holes.push(p);\n  }\n  return s;\n}\n\nfunction pointInPoly(pt, poly) {\n  let hit = false;\n  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {\n    const [xi, yi] = poly[i], [xj, yj] = poly[j];\n    if ((yi > pt[1]) !== (yj > pt[1]) &&\n        pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) hit = !hit;\n  }\n  return hit;\n}\n\n// Mitre offset of a closed polygon: positive grows it, negative shrinks it.\n// This is what opens the recess wider than the inlay that drops into it, so the\n// two never share a wall. Glyph contours are smooth enough that a mitre limit is\n// all the guarding a 0.1 mm offset needs.\nfunction offsetPoly(poly, d) {\n  if (!(Math.abs(d) > 1e-9) || poly.length < 3) return poly;\n  // Curve flattening leaves repeated points on the ring, and a zero-length edge\n  // has no usable normal — left in, each one throws the bisector at that vertex\n  // and spikes the offset far enough to swallow the clearance it exists to make.\n  const ring = [];\n  for (const q of poly) {\n    const prev = ring[ring.length - 1];\n    if (!prev || Math.hypot(q[0] - prev[0], q[1] - prev[1]) > 1e-6) ring.push(q);\n  }\n  while (ring.length > 1 &&\n         Math.hypot(ring[0][0] - ring[ring.length - 1][0], ring[0][1] - ring[ring.length - 1][1]) <= 1e-6) {\n    ring.pop();\n  }\n  if (ring.length < 3) return poly;\n  let area = 0;\n  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {\n    area += ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1];\n  }\n  const flipped = area < 0;\n  const pts = flipped ? ring.slice().reverse() : ring;   // work counter-clockwise\n  const len = pts.length;\n  const normal = (a, b) => {\n    const dx = b[0] - a[0], dy = b[1] - a[1];\n    const m = Math.hypot(dx, dy) || 1;\n    return [dy / m, -dx / m];                            // outward for a CCW ring\n  };\n  const out = [];\n  for (let i = 0; i < len; i++) {\n    const p = pts[i];\n    const n1 = normal(pts[(i - 1 + len) % len], p), n2 = normal(p, pts[(i + 1) % len]);\n    let mx = n1[0] + n2[0], my = n1[1] + n2[1];\n    const m = Math.hypot(mx, my);\n    if (m < 1e-9) continue;                              // 180 degree spike, drop it\n    mx /= m; my /= m;\n    // Mitre limit 2x: on a corner sharper than 60 degrees the offset cuts across\n    // rather than growing a whisker into whatever sits next to it.\n    const k = d / Math.max(mx * n1[0] + my * n1[1], 0.5);\n    out.push([p[0] + mx * k, p[1] + my * k]);\n  }\n  if (out.length < 3) return poly;\n  return flipped ? out.reverse() : out;\n}\n\nlet parts = [];\nlet effectiveEdge = null;\nlet effectiveDepth = 0;\nlet textFit = null;\nlet depthLimited = false;\n\nfunction build({ size, plate, pad, relief, stem, nfc, tag, tagH, edge, openBottom,\n                 num, numH, markH, depth, inlay, inlayGap, numberTop }) {\n  for (const m of parts) { model.remove(m); m.geometry.dispose(); }\n  parts = [];\n\n  const PLATE_H = mm(plate), RELIEF = mm(relief);\n  const outline = squirclePoints(size);\n  const outlineM = outline.map(([x, y]) => [mm(x), mm(y)]);\n\n  // The cavity is a real void: the plate is printed as base + walled ring +\n  // lid, so a print pause at the ring lets an NFC tag drop in before the roof.\n  // Cavity floor/roof shrink to whatever the plate can spare, so the tag fits\n  // as long as \n    };\n    for (let i = 0; i < SLICES && bM > 0; i++) {\n      const t0 = (i / SLICES) * bM, t1 = ((i + 1) / SLICES) * bM;\n      const ins = inset((t0 + t1) / 2);\n      if (roundBottom) push(ins, z0 + mm(t0), z0 + mm(t1));\n      if (roundTop) push(ins, z1 - mm(t1), z1 - mm(t0));\n    }\n    push(0, z0 + (roundBottom ? b : 0), z1 - (roundTop ? b : 0));\n  };\n  const edgeCap = mm(Math.min(edge, plate / 2 - 0.05));\n  if (!canCarve) {\n    mkLayer('squircle_plate', 0, PLATE_H, null, true, true, edgeCap);\n    effectiveEdge = null;\n  } else {\n    const ceil = PLATE_H - roof, floor = ceil - gap;\n    const d = Math.min(tag + 1, size - 4);\n    const b = openBottom\n      ? Math.max(0, Math.min(edgeCap, roof, ceil))\n      : Math.max(0, Math.min(edgeCap, roof, floor));\n    if (openBottom) {\n      mkLayer('nfc_cavity_wall', 0, ceil, d, true, false, b);\n      mkLayer('plate_lid', ceil, PLATE_H, null, false, true, b);\n    } else {\n      mkLayer('plate_base', 0, floor, null, true, false, b);\n      mkLayer('nfc_cavity_wall', floor, ceil, d, false, false, 0);\n      mkLayer('plate_lid', ceil, PLATE_H, null, false, true, b);\n    }\n    effectiveEdge = b / MM;\n  }\n\n  // counters (the enclosed voids in o/d/e) stay plate-coloured pillars inside\n  // the recess, shrunk by the same clearance so the inlay clears them too\n  for (const c of cutIslands) {\n    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;\n    for (const [x, y] of c) {\n      x0 = Math.min(x0, x); x1 = Math.max(x1, x);\n      y0 = Math.min(y0, y); y1 = Math.max(y1, y);\n    }\n    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;\n    const local = c.map(([x, y]) => [mm(x - cx), mm(y - cy)]);\n    const m = new THREE.Mesh(extrude(shapeFrom(local), depthM, 0), bone);\n    m.name = 'engrave_island';\n    m.rotation.x = -Math.PI / 2;\n    m.position.set(mm(cx), depthM / 2, -mm(cy));\n    parts.push(m);\n  }\n\n  // --- the inlay: one mesh per glyph contour, sitting in the recess cut above,\n  // shrunk by the clearance so it never shares a wall with the plate. The STL\n  // then holds two disconnected shells the slicer can split into parts, and the\n  // gap is a fraction of an extrusion width, so the print still fuses. Counters\n  // work the other way: the plate leaves a pillar at the true contour, so the\n  // matching void in the inlay grows to clear it.\n  // The inlay does reach the recess ceiling: a gap there would leave the plate\n  // bridging over a void instead of bonding to the lettering.\n  const shells = [];\n  if (useInlay) {\n    for (const part of textParts) {\n      for (const outer of part.outers) {\n        shells.push({\n          name: part.name,\n          shell: offsetPoly(outer, -clearance),\n          voids: part.islands.filter(h => pointInPoly(h[0], outer)).map(h => offsetPoly(h, clearance))\n        });\n      }\n    }\n  }\n  if (textFit) textFit.detail = useInlay ? minFeature(shells.map(s => s.shell)) : Infinity;\n  for (const { name, shell, voids } of shells) {\n    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;\n    for (const [x, y] of shell) {\n      x0 = Math.min(x0, x); x1 = Math.max(x1, x);\n      y0 = Math.min(y0, y); y1 = Math.max(y1, y);\n    }\n    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;\n    const local = (poly) => poly.map(([x, y]) => [mm(x - cx), mm(y - cy)]);\n    const m = new THREE.Mesh(\n      extrude(shapeWithHoles(local(shell), voids.map(local)), depthM, 0), graphite);\n    m.name = `text_inlay_${name}`;\n    m.rotation.x = -Math.PI / 2;\n    m.position.set(mm(cx), depthM / 2, -mm(cy));\n    parts.push(m);\n  }\n\n  // proportions traced from logo-mark-black.svg (270 x 613 units)\n  const K = (size - 2 * pad) / 613;\n  const BAR_W = 76 * K, BAR_H = 375 * K, BAR_R = 10 * K;\n  const STEM_W = 5 * K * stem;       // true logo hairline (5 units), widened for printability\n  const BAR_X = 270 * K / 2 - BAR_W / 2;\n  const STEM_X = 270 * K / 2 - 38 * K;\n  const py = (svgY) => (306.5 - svgY) * K;\n  const sink = mm(Math.min(0.2, relief * 0.1));\n  const reliefY = PLATE_H + RELIEF / 2 - sink;\n  const bevel = mm(Math.min(0.4, relief * 0.2));\n\n  const spec = [\n    ['key', 187.5, BAR_W, BAR_H, BAR_R, BAR_X, bevel],\n    ['stem', 460, STEM_W, 306 * K, STEM_W / 2, STEM_X, Math.min(bevel, mm(0.3))]\n  ];\n\n  for (const [kind, svgY, w, h, r, x, bv] of spec) {\n    for (const [side, sx] of [['left', -1], ['right', 1]]) {\n      const pts = clipToConvex(rectPoints(sx * x, py(svgY), w, h, r), outline);\n      if (pts.length < 3) continue;\n      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;\n      for (const [px, pyy] of pts) {\n        minX = Math.min(minX, px); maxX = Math.max(maxX, px);\n        minY = Math.min(minY, pyy); maxY = Math.max(maxY, pyy);\n      }\n      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;\n      const local = pts.map(([px, pyy]) => [mm(px - cx), mm(pyy - cy)]);\n      const mesh = new THREE.Mesh(extrude(shapeFrom(local), RELIEF, bv), graphite);\n      mesh.name = `${kind}_${side}`;\n      mesh.rotation.x = -Math.PI / 2;\n      mesh.position.set(mm(cx), reliefY, -mm(cy));\n      parts.push(mesh);\n    }\n  }\n\n  for (const m of parts) {\n    m.castShadow = true;\n    m.receiveShadow = true;\n    model.add(m);\n  }\n}\n\nconst ui = {\n  size: document.getElementById('size'),\n  plate: document.getElementById('plate'),\n  pad: document.getElementById('pad'),\n  stem: document.getElementById('stem'),\n  nfc: document.getElementById('nfc'),\n  tag: document.getElementById('tag'),\n  tagH: document.getElementById('tagh'),\n  edge: document.getElementById('edge'),\n  openBottom: document.getElementById('open'),\n  relief: document.getElementById('relief'),\n  num: document.getElementById('num'),\n  digits: document.getElementById('digits'),\n  numH: document.getElementById('numh'),\n  markH: document.getElementById('markh'),\n  numberTop: document.getElementById('numtop'),\n  depth: document.getElementById('depth'),\n  inlay: document.getElementById('inlay'),\n  inlayGap: document.getElementById('gap')\n};\nconst nFrom = document.getElementById('nfrom');\nconst nTo = document.getElementById('nto');\nconst batchNote = document.getElementById('batch-note');\nconst dims = document.getElementById('dims');\nconst padWidth = () => Math.min(4, Math.max(1, Math.round(Number(ui.digits.value) || 1)));\nconst pad = (n) => String(n).padStart(padWidth(), '0');\n\nconst apply = (first) => {\n  const v = {\n    size: Number(ui.size.value),\n    plate: Number(ui.plate.value),\n    pad: Number(ui.pad.value),\n    stem: Number(ui.stem.value),\n    nfc: ui.nfc.checked,\n    tag: Number(ui.tag.value),\n    tagH: Number(ui.tagH.value),\n    edge: Number(ui.edge.value),\n    openBottom: ui.openBottom.checked,\n    relief: Number(ui.relief.value),\n    num: pad(Math.round(Number(ui.num.value) || 0)),\n    numH: Number(ui.numH.value),\n    markH: Number(ui.markH.value),\n    numberTop: ui.numberTop.checked,\n    depth: Number(ui.depth.value),\n    inlay: ui.inlay.checked,\n    inlayGap: Number(ui.inlayGap.value)\n  };\n  document.getElementById('numtop-val').textContent = v.numberTop ? 'on' : 'off';\n  document.getElementById('depth-val').textContent = v.depth.toFixed(2) + ' mm';\n  document.getElementById('inlay-val').textContent = v.inlay ? 'on' : 'off';\n  document.getElementById('gap-val').textContent = v.inlayGap.toFixed(2) + ' mm';\n  ui.inlayGap.disabled = !v.inlay;\n  ui.inlayGap.parentElement.style.opacity = v.inlay ? '1' : '0.45';\n  document.getElementById('size-val').textContent = v.size.toFixed(1) + ' mm';\n  document.getElementById('plate-val').textContent = v.plate.toFixed(1) + ' mm';\n  document.getElementById('pad-val').textContent = v.pad.toFixed(1) + ' mm';\n  const hair = 5 * ((v.size - 2 * v.pad) / 613) * v.stem;\n  const hairEl = document.getElementById('stem-val');\n  hairEl.textContent = hair.toFixed(1) + ' mm' + (hair < 0.8 ? ' · thin' : '');\n  hairEl.style.color = hair < 0.8 ? 'var(--gray-500)' : 'var(--foreground)';\n  document.getElementById('relief-val').textContent = v.relief.toFixed(1) + ' mm';\n  const maxTag = v.size - 5;\n  const clamped = Math.min(v.tag, maxTag);\n  document.getElementById('tag-val').textContent =\n    clamped < v.tag ? clamped.toFixed(1) + ' mm · tile limit' : v.tag.toFixed(1) + ' mm';\n  document.getElementById('tagh-val').textContent = v.tagH.toFixed(1) + ' mm';\n  const fits = v.tagH < v.plate;\n  document.getElementById('nfc-val').textContent =\n    !v.nfc ? 'off' : fits ? (v.openBottom ? 'open recess' : 'sealed pocket') : 'tag thicker than plate';\n  document.getElementById('open-val').textContent = v.openBottom ? 'on' : 'off';\n  ui.openBottom.disabled = !v.nfc;\n  ui.openBottom.parentElement.style.opacity = v.nfc ? '1' : '0.45';\n  for (const el of [ui.tag, ui.tagH]) {\n    el.disabled = !v.nfc;\n    el.parentElement.style.opacity = v.nfc ? '1' : '0.45';\n  }\n  document.getElementById('edge-val').textContent = v.edge.toFixed(2) + ' mm';\n  const sinkMM = Math.min(0.2, v.relief * 0.1);\n  dims.innerHTML = `${v.size.toFixed(1)} mm squircle · ${v.plate.toFixed(1)} mm plate<br>${(v.plate + v.relief - sinkMM).toFixed(2)} mm total height`;\n  build(v);\n  const eEl = document.getElementById('edge-val');\n  const eff = effectiveEdge;\n  eEl.textContent = (eff == null || eff >= v.edge - 0.001)\n    ? v.edge.toFixed(2) + ' mm'\n    : eff.toFixed(2) + ' mm · plate limit';\n  // Each row reports the height it actually got: \"chordlist\" is wide enough that\n  // on a small tile the tile, not the slider, is what sets it.\n  for (const [id, fit, asked] of [['numh-val', textFit?.number, v.numH],\n                                  ['markh-val', textFit?.wordmark, v.markH]]) {\n    const el = document.getElementById(id);\n    const shown = fit ? fit.height : asked;\n    el.textContent = shown.toFixed(2) + ' mm' + (fit?.limited ? ' · width-fit' : '');\n    el.style.color = fit?.limited ? 'var(--gray-500)' : 'var(--foreground)';\n  }\n  // Two things can be too thin to print: the plate left standing between the\n  // letters, and the lettering itself once the clearance has come off it. Report\n  // whichever is closer to the edge, by name, and grey it below one extrusion\n  // width — that is the figure that decides whether the bottom face reads.\n  const gapEl = document.getElementById('gap-val');\n  const thin = textFit && v.inlay\n    ? (textFit.bridge < textFit.detail\n        ? ['bridge', textFit.bridge] : ['detail', textFit.detail])\n    : null;\n  if (thin && Number.isFinite(thin[1])) {\n    gapEl.textContent += ` · ${thin[0]} ${thin[1].toFixed(2)} mm`;\n    gapEl.style.color = thin[1] < 0.4 ? 'var(--gray-500)' : 'var(--foreground)';\n  } else {\n    gapEl.style.color = 'var(--foreground)';\n  }\n  if (depthLimited) document.getElementById('depth-val').textContent =\n    effectiveDepth > 0 ? effectiveDepth.toFixed(2) + ' mm · plate limit' : 'no room under the pocket';\n  if (v.inlay && effectiveDepth > 0 && effectiveDepth < 0.2) {\n    document.getElementById('depth-val').textContent += ' · under 1 layer';\n  }\n  if (v.nfc && v.openBottom) document.getElementById('depth-val').textContent = 'no bottom face';\n  if (first) stage.setObject(model);\n};\nfor (const el of Object.values(ui)) el.addEventListener('input', () => apply(false));\nui.nfc.addEventListener('change', () => apply(false));\nui.openBottom.addEventListener('change', () => apply(false));\nui.inlay.addEventListener('change', () => apply(false));\nui.numberTop.addEventListener('change', () => apply(false));\napply(true);\n\n// Config round-trip: the same key set the sliders read, as plain JSON.\nconst cfgEl = document.getElementById('cfg');\nconst cfgNote = document.getElementById('cfg-note');\nconst cfgKeys = Object.keys(ui);\nconst syncCfg = () => {\n  cfgEl.value = JSON.stringify(Object.fromEntries(cfgKeys.map(k => [\n    k, ui[k].type === 'checkbox' ? ui[k].checked : Number(ui[k].value)\n  ])));\n};\nsyncCfg();\nfor (const el of Object.values(ui)) {\n  el.addEventListener('input', syncCfg);\n  el.addEventListener('change', syncCfg);\n}\ndocument.getElementById('cfg-copy').addEventListener('click', async () => {\n  syncCfg();\n  try {\n    await navigator.clipboard.writeText(cfgEl.value);\n    cfgNote.textContent = 'copied';\n  } catch (e) {\n    cfgEl.select();\n    cfgNote.textContent = 'select + copy';\n  }\n});\ndocument.getElementById('cfg-load').addEventListener('click', () => {\n  let data;\n  try {\n    data = JSON.parse(cfgEl.value);\n  } catch (e) {\n    cfgNote.textContent = 'invalid JSON';\n    return;\n  }\n  const applied = [];\n  for (const k of cfgKeys) {\n    if (!(k in data)) continue;\n    const el = ui[k];\n    if (el.type === 'checkbox') el.checked = !!data[k];\n    else {\n      const n = Number(data[k]);\n      if (!Number.isFinite(n)) continue;\n      el.value = String(Math.min(Number(el.max), Math.max(Number(el.min), n)));\n    }\n    applied.push(k);\n  }\n  apply(false);\n  syncCfg();\n  cfgNote.textContent = applied.length ? `applied ${applied.length} values` : 'no known keys';\n});\n\n// Binary STL — written here rather than via an addon; STL is unitless, so\n// the metre-scale model is emitted in millimetres (the slicer convention).\n// `include` filters which meshes land in the file, which is how the two-colour\n// export splits plate from lettering without moving anything: both files share\n// the model's coordinate space, so a slicer stacks them back exactly.\nfunction stlBuffer(include) {\n  const tris = [];\n  const v = new THREE.Vector3();\n  model.updateMatrixWorld(true);\n  model.traverse((o) => {\n    if (!o.isMesh) return;\n    if (include && !include(o)) return;\n    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry;\n    const pos = g.getAttribute('position');\n    for (let i = 0; i < pos.count; i += 3) {\n      const p = [];\n      for (let k = 0; k < 3; k++) {\n        v.fromBufferAttribute(pos, i + k).applyMatrix4(o.matrixWorld).multiplyScalar(1000);\n        // scene is y-up; STL/slicers are z-up, so swap to land flat on the bed\n        p.push(new THREE.Vector3(v.x, -v.z, v.y));\n      }\n      const n = new THREE.Vector3()\n        .subVectors(p[1], p[0])\n        .cross(new THREE.Vector3().subVectors(p[2], p[0]))\n        .normalize();\n      tris.push([n, p[0], p[1], p[2]]);\n    }\n  });\n  const buf = new ArrayBuffer(84 + tris.length * 50);\n  const dv = new DataView(buf);\n  dv.setUint32(80, tris.length, true);\n  let off = 84;\n  for (const t of tris) {\n    for (const q of t) {\n      dv.setFloat32(off, q.x, true);\n      dv.setFloat32(off + 4, q.y, true);\n      dv.setFloat32(off + 8, q.z, true);\n      off += 12;\n    }\n    dv.setUint16(off, 0, true);\n    off += 2;\n  }\n  return buf;\n}\n\nconst save = (blob, name) => {\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = name;\n  a.click();\n  setTimeout(() => URL.revokeObjectURL(a.href), 5000);\n};\n\ndocument.getElementById('stl').addEventListener('click', () => {\n  save(new Blob([stlBuffer()], { type: 'model/stl' }),\n    `chordlist-tile-${pad(Math.round(Number(ui.num.value) || 0))}.stl`);\n});\n\n// The accent colour is everything cut from graphite: the raised mark on top and\n// the inlaid lettering underneath.\nconst isAccent = (o) => o.material === graphite;\n\ndocument.getElementById('stl-parts').addEventListener('click', () => {\n  const n = pad(Math.round(Number(ui.num.value) || 0));\n  save(zip([\n    { name: `chordlist-tile-${n}-plate.stl`, data: new Uint8Array(stlBuffer(o => !isAccent(o))) },\n    { name: `chordlist-tile-${n}-accent.stl`, data: new Uint8Array(stlBuffer(isAccent)) }\n  ]), `chordlist-tile-${n}-2colour.zip`);\n});\n\n// --- STORE-only ZIP writer, so a numbered range lands as one download ---\nconst crcTable = (() => {\n  const t = new Uint32Array(256);\n  for (let i = 0; i < 256; i++) {\n    let c = i;\n    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;\n    t[i] = c >>> 0;\n  }\n  return t;\n})();\nconst crc32 = (u8) => {\n  let c = 0xFFFFFFFF;\n  for (let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);\n  return (c ^ 0xFFFFFFFF) >>> 0;\n};\n\nfunction zip(files) {\n  const enc = new TextEncoder();\n  const parts = [], central = [];\n  let offset = 0;\n  for (const f of files) {\n    const name = enc.encode(f.name);\n    const crc = crc32(f.data);\n    const lh = new DataView(new ArrayBuffer(30));\n    lh.setUint32(0, 0x04034b50, true);\n    lh.setUint16(4, 20, true);\n    lh.setUint16(8, 0, true);\n    lh.setUint32(14, crc, true);\n    lh.setUint32(18, f.data.length, true);\n    lh.setUint32(22, f.data.length, true);\n    lh.setUint16(26, name.length, true);\n    parts.push(new Uint8Array(lh.buffer), name, f.data);\n    const cd = new DataView(new ArrayBuffer(46));\n    cd.setUint32(0, 0x02014b50, true);\n    cd.setUint16(4, 20, true);\n    cd.setUint16(6, 20, true);\n    cd.setUint32(16, crc, true);\n    cd.setUint32(20, f.data.length, true);\n    cd.setUint32(24, f.data.length, true);\n    cd.setUint16(28, name.length, true);\n    cd.setUint32(42, offset, true);\n    central.push(new Uint8Array(cd.buffer), name);\n    offset += 30 + name.length + f.data.length;\n  }\n  const cdSize = central.reduce((s, p) => s + p.length, 0);\n  const eo = new DataView(new ArrayBuffer(22));\n  eo.setUint32(0, 0x06054b50, true);\n  eo.setUint16(8, files.length, true);\n  eo.setUint16(10, files.length, true);\n  eo.setUint32(12, cdSize, true);\n  eo.setUint32(16, offset, true);\n  return new Blob([...parts, ...central, new Uint8Array(eo.buffer)], { type: 'application/zip' });\n}\n\ndocument.getElementById('batch').addEventListener('click', async () => {\n  const a = Math.round(Number(nFrom.value) || 0);\n  const b = Math.round(Number(nTo.value) || 0);\n  if (b < a) { batchNote.textContent = 'range is empty'; return; }\n  if (b - a > 200) { batchNote.textContent = 'max 200 per export'; return; }\n  const keep = ui.num.value;\n  const width = Math.max(padWidth(), String(b).length);\n  const files = [];\n  for (let n = a; n <= b; n++) {\n    ui.num.value = String(n);\n    apply(false);\n    batchNote.textContent = `building ${n - a + 1} / ${b - a + 1}`;\n    await new Promise(r => requestAnimationFrame(r));\n    files.push({\n      name: `chordlist-tile-${String(n).padStart(width, '0')}.stl`,\n      data: new Uint8Array(stlBuffer())\n    });\n  }\n  ui.num.value = keep;\n  apply(false);\n  syncCfg();\n  save(zip(files), `chordlist-tiles-${a}-${b}.zip`);\n  batchNote.textContent = `${files.length} STL files zipped`;\n});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
