<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Mirrors the header mark: bg-foreground square, text-background glyph. */
    .bg { fill: #0A0A0A; }
    .fg { fill: #FAFAFA; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #FAFAFA; }
      .fg { fill: #0A0A0A; }
    }
  </style>
  <rect class="bg" width="180" height="180" rx="45" />
  <!-- ChordlistIcon (viewBox 0 0 270 613) scaled to full height and centered,
       matching the header's `xMidYMid meet` fit into a square. -->
  <g class="fg" transform="translate(50.359,0) scale(0.2936378)">
    <rect x="0" y="0" width="76" height="375" rx="10" />
    <rect x="35.5" y="307" width="5" height="306" />
    <rect x="194" y="0" width="76" height="375" rx="10" />
    <rect x="229.5" y="307" width="5" height="306" />
  </g>
</svg>
